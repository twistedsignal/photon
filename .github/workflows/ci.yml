name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rokit tools
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install Wally packages
        run: wally install

      - name: Lint and test
        run: ./scripts/test.bash

      - name: Build
        run: ./scripts/build.bash
